<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大坝巡检、缺陷与应急管理</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:900px;margin:2rem auto;padding:0 1rem;color:#17212b}pre{background:#f4f7f9;padding:1rem;overflow:auto}button{padding:.55rem 1rem;margin-right:.4rem}</style></head><body><h1>大坝巡检、缺陷与应急管理</h1><p>安排巡检，记录渗流、位移、裂缝等缺陷并跟踪修复、复检和应急预案</p><p>异常值比控制阈值越高，缺陷优先级越高；重大/应急缺陷确认后安排处置调度：按技能匹配空闲班组并同时占住泵机、车辆，冲突返回占用对象且整笔不保存；到场前可撤单释放，到场后只能办结并归还全部物资，调度办结前缺陷不允许关闭。</p><button onclick="load('/api/items')">缺陷列表</button><button onclick="load('/api/crews')">抢修班组</button><button onclick="load('/api/resources')">泵机车辆</button><button onclick="load('/api/dispatches')">处置调度</button><pre id="out">使用X-Actor和X-Role请求头调用接口。</pre><script>async function load(url){const r=await fetch(url,{headers:{'X-Actor':'demo','X-Role':'viewer'}});document.getElementById('out').textContent=JSON.stringify(await r.json(),null,2)}</script></body></html>
